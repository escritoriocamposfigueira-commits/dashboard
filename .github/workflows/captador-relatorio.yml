name: Relatório semanal do captador

on:
  schedule:
    - cron: "0 11 * * 1"   # segunda, 08:00 BRT
    - cron: "30 11 1 * *"  # limpeza mensal, dia 1 às 08:30 BRT
  workflow_dispatch:
    inputs:
      executar_limpeza:
        description: "Apagar leads perdidos/não contatar com mais de 12 meses"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  captador:
    runs-on: ubuntu-latest
    env:
      CAPTADOR_API_URL: https://ggfjmqttrktsfcaymsvu.supabase.co/functions/v1/captador-api
      CAPTADOR_OIDC_AUDIENCE: https://ggfjmqttrktsfcaymsvu.supabase.co/functions/v1/captador-api/meta-poll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validar estrutura
        run: node captador/scripts/verificar-prontidao.mjs
      - name: Obter identidade temporária do GitHub
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken(process.env.CAPTADOR_OIDC_AUDIENCE);
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Gerar relatório agregado
        if: github.event.schedule != '30 11 1 * *' && inputs.executar_limpeza != true
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node captador/scripts/relatorio-semanal.mjs "relatorios/leads/$(date -u +%F).md"
      - name: Limpar dados expirados
        if: github.event.schedule == '30 11 1 * *' || inputs.executar_limpeza == true
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer ${GITHUB_OIDC_TOKEN}" \
            "${CAPTADOR_API_URL}/maintenance/cleanup"
      - name: Salvar somente relatório sem dados pessoais
        if: github.event.schedule != '30 11 1 * *' && inputs.executar_limpeza != true
        run: |
          git config user.name "Campos Figueira Bot"
          git config user.email "bot@users.noreply.github.com"
          git add relatorios/leads/
          git diff --staged --quiet || git commit -m "relatório: leads da semana [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
