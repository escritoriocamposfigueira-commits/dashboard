name: Desempenho semanal das redes e leads

on:
  schedule:
    - cron: "20 11 * * 1" # segunda, 08:20 BRT; após o relatório agregado de leads
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: relatorio-performance
  cancel-in-progress: false

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      META_PAGE_ID: "512040582222121"
      META_IG_ID: "17841461388445580"
      META_GRAPH_VERSION: v22.0
      RELATORIO_DIAS: "7"
      CAPTADOR_API_URL: https://ggfjmqttrktsfcaymsvu.supabase.co/functions/v1/captador-api
      CAPTADOR_OIDC_AUDIENCE: https://ggfjmqttrktsfcaymsvu.supabase.co/functions/v1/captador-api/meta-poll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Obter identidade temporária do GitHub
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken(process.env.CAPTADOR_OIDC_AUDIENCE);
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Coletar métricas e cruzar com leads
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node src/relatorio/coletar.js "relatorios/performance/$(date -u +%F).md"

      - name: Testar regras do relatório
        run: node --test tests/relatorio.test.js

      - name: Salvar relatório agregado e pesos de formato
        run: |
          git config user.name "Campos Figueira Bot"
          git config user.email "bot@users.noreply.github.com"
          git add relatorios/performance/ config/pesos-formatos.json
          git diff --staged --quiet || git commit -m "relatório: desempenho semanal [skip ci]"
          for tentativa in 1 2 3; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((tentativa * 5))
          done
          exit 1
