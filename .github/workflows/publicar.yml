name: Publicar imóveis (servidor 24h)

# Servidor 24h grátis do GitHub. Publica sozinho com o PC desligado.
# Grade semanal em horário de Brasília (UTC-3):
# venda diária, locação diária, 1 locação extra, 2 captações rotativas,
# e recuperação diária. Captação fixa somente quando houver vídeo aprovado.
on:
  schedule:
    - cron: "7 15 * * *"      # Venda — 12:07 BRT; Status WhatsApp às 12:30
    - cron: "7 19 * * *"      # Locação — 16:07 BRT; Status WhatsApp às 16:30
    - cron: "0 21 * * 1"      # Locação extra — segunda, 18:00 BRT
    - cron: "10 21 * * 3,6"   # Captação — quarta e sábado, 18:10 BRT
    - cron: "30 22 * * *"     # Recuperação de canal da locação — 19:30 BRT
  workflow_dispatch:
    inputs:
      tipo_publicacao:
        description: "Fila a executar"
        required: false
        type: choice
        default: venda
        options:
          - venda
          - locacao
          - captacao
          - captacao_semanal
          - recuperar_locacao
      codigo_imovel:
        description: "Código específico opcional, por exemplo 516"
        required: false
        type: string
      forcar_republicacao:
        description: "Republicar mesmo se o imóvel já saiu nas últimas 30 horas"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-imoveis
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o catálogo de vídeos aprovados
        uses: actions/checkout@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar identidade git (para salvar o estado)
        run: |
          git config user.name "Campos Figueira Bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publicar próximo imóvel (FB + IG · Feed + Story em vídeo)
        id: publicar
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
          PUBLICACAO_TIPO: ${{ inputs.tipo_publicacao || '' }}
          PUBLICACAO_CODIGO: ${{ inputs.codigo_imovel || '' }}
          PUBLICACAO_FORCAR: ${{ inputs.forcar_republicacao || 'false' }}
          PUBLICACAO_FORMATO: reel
          CAPTADOR_ENABLED: ${{ vars.CAPTADOR_ENABLED || 'true' }}
          CAPTADOR_PAGES_URL: ${{ vars.CAPTADOR_PAGES_URL || 'https://escritoriocamposfigueira-commits.github.io/dashboard/captador' }}
          CAPTADOR_SOCIAL_COMMENTS_ACTIVE: ${{ vars.CAPTADOR_SOCIAL_COMMENTS_ACTIVE || 'true' }}
          # Opcionais: robô só posta no YouTube/TikTok quando estes Secrets existirem.
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Pausado por decisão do escritório. Só será reativado após nova autorização.
          TIKTOK_ENABLED: "false"
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
          TIKTOK_PRIVACY: ${{ secrets.TIKTOK_PRIVACY }}
          # TikTok permanente (recomendado): renova o access_token sozinho a cada post.
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: node scripts/publicar-servidor.js

      - name: Salvar estado da fila no repositório
        run: |
          git add controle/estado-publicacao.json
          git diff --staged --quiet || git commit -m "estado: publicação automática [skip ci]"
          for tentativa in 1 2 3; do
            echo "Sincronização do estado: tentativa ${tentativa}/3"
            if ! git pull --rebase origin "${{ github.ref_name }}"; then
              git rebase --abort 2>/dev/null || true
              sleep $((tentativa * 5))
              continue
            fi
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Estado salvo com sucesso."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((tentativa * 5))
          done
          echo "::error::A publicação ocorreu, mas o estado não pôde ser salvo após 3 tentativas."
          exit 1

      - name: Sinalizar canais incompletos após salvar a fila
        if: ${{ steps.publicar.outputs.canais_incompletos != '' }}
        env:
          CANAIS_INCOMPLETOS: ${{ steps.publicar.outputs.canais_incompletos }}
        run: |
          echo "::error::Ainda pendente: $CANAIS_INCOMPLETOS. Estado salvo para recuperação sem duplicar canais concluídos."
          exit 1
