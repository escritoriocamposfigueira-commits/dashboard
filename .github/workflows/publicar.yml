name: Publicar imóveis (servidor 24h)

# Servidor 24h grátis do GitHub. Publica sozinho com o PC desligado.
# 2 imóveis por dia: 09:00 e 18:00 (horário de Brasília = UTC-3).
on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 BRT
    - cron: "0 21 * * *"   # 18:00 BRT
  workflow_dispatch: {}     # botão "Run workflow" para disparo manual

permissions:
  contents: write

concurrency:
  group: publicar-imoveis
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto (com trilhas de música)
        uses: actions/checkout@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Garantir FFmpeg instalado
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg ausente — instalando..."
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          which ffmpeg && ffmpeg -version | head -1

      - name: Configurar identidade git (para push do vídeo + estado)
        run: |
          git config user.name "Campos Figueira Bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publicar próximo imóvel (FB + IG · Feed + Story em vídeo)
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          # Opcionais: robô só posta no YouTube/TikTok quando estes Secrets existirem.
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
          TIKTOK_PRIVACY: ${{ secrets.TIKTOK_PRIVACY }}
        run: node scripts/publicar-servidor.js

      - name: Salvar estado da fila no repositório
        run: |
          git add controle/estado-publicacao.json public/videos/ || true
          git diff --staged --quiet || git commit -m "estado: publicação automática [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true
