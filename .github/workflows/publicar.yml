name: Publicar imóveis (servidor 24h)

# Servidor 24h grátis do GitHub. Publica sozinho com o PC desligado.
# Grade semanal em horário de Brasília (UTC-3):
# venda diária, locação diária, 1 locação extra, 2 captações e recuperação diária.
on:
  schedule:
    - cron: "0 12 * * *"      # Venda — 09:00 BRT
    - cron: "0 18 * * *"      # Locação — 15:00 BRT
    - cron: "0 21 * * 1"      # Locação extra — segunda, 18:00 BRT
    - cron: "10 21 * * 3,6"   # Captação — quarta e sábado, 18:10 BRT
    - cron: "30 22 * * *"     # Recuperação de canal da locação — 19:30 BRT
  workflow_dispatch:
    inputs:
      forcar_republicacao:
        description: "Republicar mesmo se o imóvel já saiu nas últimas 30 horas"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-imoveis
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto (com trilhas de música)
        uses: actions/checkout@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Garantir FFmpeg instalado
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg ausente — instalando..."
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          which ffmpeg && ffmpeg -version | head -1

      - name: Configurar identidade git (para push do vídeo + estado)
        run: |
          git config user.name "Campos Figueira Bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publicar próximo imóvel (FB + IG · Feed + Story em vídeo)
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
          PUBLICACAO_FORCAR: ${{ inputs.forcar_republicacao || 'false' }}
          # Opcionais: robô só posta no YouTube/TikTok quando estes Secrets existirem.
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Pausado por decisão do escritório. Só será reativado após nova autorização.
          TIKTOK_ENABLED: "false"
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
          TIKTOK_PRIVACY: ${{ secrets.TIKTOK_PRIVACY }}
          # TikTok permanente (recomendado): renova o access_token sozinho a cada post.
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: node scripts/publicar-servidor.js

      - name: Salvar estado da fila no repositório
        run: |
          git add controle/estado-publicacao.json controle/estado-trilhas.json public/videos/
          test ! -f controle/estado-modelos-story.json || git add -f controle/estado-modelos-story.json
          git diff --staged --quiet || git commit -m "estado: publicação automática [skip ci]"
          for tentativa in 1 2 3; do
            echo "Sincronização do estado: tentativa ${tentativa}/3"
            if ! git pull --rebase origin "${{ github.ref_name }}"; then
              git rebase --abort 2>/dev/null || true
              sleep $((tentativa * 5))
              continue
            fi
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Estado salvo com sucesso."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((tentativa * 5))
          done
          echo "::error::A publicação ocorreu, mas o estado não pôde ser salvo após 3 tentativas."
          exit 1
