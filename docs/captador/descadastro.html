<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Descadastro | Campos Figueira</title><link rel="stylesheet" href="styles.css"><script defer src="config.js"></script></head><body><header class="wrap top"><div class="brand"><span class="monogram">CF</span><span>ESCRITÓRIO CAMPOS FIGUEIRA</span></div></header><main class="wrap hero"><section><div class="eyebrow">Privacidade</div><h1>Parar mensagens <span>imediatamente.</span></h1><p class="lead">Informe o WhatsApp ou e-mail cadastrado. O contato será incluído na lista permanente de bloqueio.</p></section><section class="card"><form id="unsubscribe"><label>Operação</label><select name="operacao"><option value="">Todas</option><option value="imobiliaria">Imobiliária</option><option value="engenharia">Engenharia</option><option value="advocacia">Advocacia</option></select><label>WhatsApp</label><input name="telefone" inputmode="tel"><label>E-mail</label><input name="email" type="email"><button class="btn" type="submit">CONFIRMAR DESCADASTRO</button><div id="status" class="status"></div></form></section></main><script>document.getElementById('unsubscribe').addEventListener('submit',async e=>{e.preventDefault();const s=document.getElementById('status'),cfg=window.CAPTADOR_CONFIG||{};try{if(!cfg.apiUrl||cfg.apiUrl.includes('SEU-PROJETO'))throw new Error('Serviço aguardando conexão segura.');const r=await fetch(cfg.apiUrl+'/unsubscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),j=await r.json();if(!r.ok)throw new Error(j.erro||'Falha no descadastro');s.className='status ok';s.textContent=j.mensagem}catch(x){s.className='status error';s.textContent=x.message}})</script></body></html>
